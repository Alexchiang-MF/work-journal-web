<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>個人工作手札</title>
<style>
/* ============================================================
   配色：清水模 × 北歐極簡
   暖中性灰為底（水泥、亞麻、原木），語意色一律降飽和，
   靠「淡底 + 深字 + 左側色條」分辨，而非大面積填色。
   圓角壓到 2~3px、陰影近乎無，分層改由 1px 細線承擔。
   ============================================================ */
:root{
  color-scheme:light;
  /* -- 底層：暖灰階（水泥與紙） -- */
  --bg:#edebe7;      --surface:#f8f7f4;   --surface-2:#e4e1db;
  --border:#d3cfc6;  --line:#e0ddd5;
  --text:#232120;    --muted:#57544e;     --faint:#6b665e;
  /* -- 主色 · 已確認行程（陶土，對應行事曆橘色 colorId 6） -- */
  --accent:#9a5b3d;  --accent-hi:#7d4830; --accent-fg:#ffffff;
  --accent-soft:#f0e8e2;                  --accent-line:#d3bcae;
  --accent-ink:#7a4630;
  /* -- 警示色 · 待確認時間（赭石，對應行事曆黃色 colorId 5） -- */
  --warn:#856527;    --warn-soft:#efeadc; --warn-line:#cfc19d;
  --warn-ink:#66501c;
  /* -- 次要色 · 會議紀錄（灰藍） -- */
  --meet:#4b6a76;    --meet-soft:#e6ecee; --meet-line:#c0cfd3;
  --meet-ink:#3a545f;
  --today:#eee9e1;   --danger:#96453f;
  --r-lg:3px;        --r-sm:2px;
  --ring:0 0 0 3px rgba(154,91,61,.20);
  --shadow:0 1px 2px rgba(35,33,32,.04);
  --shadow-pop:0 8px 28px rgba(35,33,32,.14),0 1px 4px rgba(35,33,32,.06);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --bg:#1a1917;      --surface:#221f1d;   --surface-2:#2a2724;
  --border:#37332e;  --line:#2f2c28;
  --text:#e9e5de;    --muted:#a8a39a;     --faint:#8f8a81;
  --accent:#d1906c;  --accent-hi:#e0a684; --accent-fg:#231610;
  --accent-soft:#2e231c;                  --accent-line:#57402f;
  --accent-ink:#dda183;
  --warn:#c9a75f;    --warn-soft:#2a2519; --warn-line:#514726;
  --warn-ink:#d1b271;
  --meet:#8fb0bb;    --meet-soft:#1e2629; --meet-line:#3b4d54;
  --meet-ink:#9dbcc6;
  --today:#2b241e;   --danger:#d97a70;
  --r-lg:3px;        --r-sm:2px;
  --ring:0 0 0 3px rgba(209,144,108,.28);
  --shadow:0 1px 2px rgba(0,0,0,.28);
  --shadow-pop:0 12px 34px rgba(0,0,0,.55),0 1px 6px rgba(0,0,0,.35);
}}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#1a1917;      --surface:#221f1d;   --surface-2:#2a2724;
  --border:#37332e;  --line:#2f2c28;
  --text:#e9e5de;    --muted:#a8a39a;     --faint:#8f8a81;
  --accent:#d1906c;  --accent-hi:#e0a684; --accent-fg:#231610;
  --accent-soft:#2e231c;                  --accent-line:#57402f;
  --accent-ink:#dda183;
  --warn:#c9a75f;    --warn-soft:#2a2519; --warn-line:#514726;
  --warn-ink:#d1b271;
  --meet:#8fb0bb;    --meet-soft:#1e2629; --meet-line:#3b4d54;
  --meet-ink:#9dbcc6;
  --today:#2b241e;   --danger:#d97a70;
  --r-lg:3px;        --r-sm:2px;
  --ring:0 0 0 3px rgba(209,144,108,.28);
  --shadow:0 1px 2px rgba(0,0,0,.28);
  --shadow-pop:0 12px 34px rgba(0,0,0,.55),0 1px 6px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.75;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  letter-spacing:.012em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ── 密碼閘門 ── */
.gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.gatebox{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:30px 26px;box-shadow:var(--shadow);text-align:center}
.gatebox h1{font-size:20px;font-weight:500;margin:0 0 8px;letter-spacing:.08em}
.gatebox p{font-size:13.5px;color:var(--faint);margin:0 0 20px}
.gatebox input{width:100%;padding:13px 15px;font-size:16px;font-family:inherit;
  background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--r-sm);
  text-align:center;letter-spacing:.14em}
.gatebox input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.gatebox button{width:100%;margin-top:12px;padding:13px;font-size:15px;font-weight:500;
  font-family:inherit;background:var(--accent);color:var(--accent-fg);
  border:1px solid var(--accent);border-radius:var(--r-sm);transition:background .12s,border-color .12s;
  cursor:pointer;letter-spacing:.08em}
.gatebox button:disabled{opacity:.55;cursor:default}
.gatebox .msg{margin-top:14px;font-size:13px;min-height:20px}
.gatebox .msg.err{color:var(--danger)}
.gatebox .msg.work{color:var(--muted)}
.gatebox .keep{margin-top:14px;font-size:12.5px;color:var(--faint);
  display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;user-select:none}
.gatebox .keep input{width:auto;margin:0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 主畫面 ── */
/* 月曆吃滿寬版，其餘閱讀性內容維持易讀行寬（靠左與月曆左緣對齊） */
.wrap{max-width:1420px;margin:0 auto;padding:40px 18px 84px}
#q,.detail,.sechead,.filters,.sechint,#sum,footer{max-width:1060px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:22px}
h1.t{font-size:22px;font-weight:500;margin:0;letter-spacing:.06em}
.stat{color:var(--faint);font-size:12px;letter-spacing:.04em}
.lock{align-self:center;font-size:12px;color:var(--muted);border:1px solid var(--border);
  background:transparent;border-radius:var(--r-sm);padding:4px 12px;cursor:pointer;font-family:inherit;
  line-height:1.5;letter-spacing:.04em;transition:background .12s,border-color .12s,color .12s}
.lock:hover{background:var(--surface-2);border-color:var(--accent-line);color:var(--accent-ink)}
#q{width:100%;padding:12px 15px;font-size:16px;font-family:inherit;margin-bottom:24px;
  background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--r-lg)}
#q:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.nav{display:flex;align-items:center;gap:9px;margin-bottom:15px;flex-wrap:wrap}
.nav h2{font-size:17px;font-weight:500;margin:0;min-width:126px;letter-spacing:.03em;
  font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--border);background:transparent;color:var(--muted);
  border-radius:var(--r-sm);padding:5px 13px;font-size:13.5px;cursor:pointer;font-family:inherit;
  line-height:1.5;letter-spacing:.04em;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--accent-line);color:var(--accent-ink)}
.btn:active{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
/* 月／週切換 */
.seg{display:inline-flex;border:1px solid var(--border);background:transparent;
  border-radius:var(--r-sm);overflow:hidden}
.segb{border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;
  padding:5px 15px;cursor:pointer;line-height:1.5;letter-spacing:.06em;
  transition:background .12s,color .12s}
.segb+.segb{border-left:1px solid var(--border)}
.segb:hover{background:var(--surface-2);color:var(--accent-ink)}
.segb.on{background:var(--accent);color:var(--accent-fg);font-weight:500}
.segb.on:hover{background:var(--accent-hi)}
.legend{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);
  letter-spacing:.04em}
.legend i{display:inline-block;width:16px;height:11px;margin-right:6px;vertical-align:-1px;
  border:1px solid var(--border);border-left:3px solid transparent}
.lg-s{background:var(--accent-soft);border-color:var(--accent-line);border-left-color:var(--accent)}
.lg-g{background:var(--warn-soft);border-color:var(--warn-line);
  border-left-color:var(--warn);border-left-style:dashed}
.lg-m{background:var(--meet-soft);border-color:var(--meet-line);border-left-color:var(--meet)}
.cal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow);margin-bottom:8px}
.cal .wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--border)}
.cal .wd div{padding:9px 0;text-align:center;font-size:10.5px;font-weight:500;color:var(--faint);
  letter-spacing:.22em}
.cal .wd div.we{color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cell{min-height:106px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:4px 5px 5px;cursor:pointer}
.cell:nth-child(7n){border-right:none}
.grid>.cell:nth-last-child(-n+7){border-bottom:none}
.cell:hover{background:var(--accent-soft)}
.cell.out{background:var(--bg);opacity:.62}
.cell.today{background:var(--today)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dnum{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;
  display:inline-block;min-width:19px;text-align:center;line-height:19px;border-radius:50%}
.cell.today .dnum{background:var(--accent);color:var(--accent-fg);font-weight:700}
.cell.out .dnum{color:var(--faint);font-weight:400}
/* 事項標籤：整塊填色在寬版月曆上過於厚重，
   改為淡底 + 深字，左側 3px 色條承擔辨識 */
.ev{font-size:11px;line-height:1.45;margin-top:3px;padding:2px 5px;border-radius:0 var(--r-sm) var(--r-sm) 0;
  border-left:3px solid transparent;
  overflow:hidden;overflow-wrap:anywhere;word-break:break-word;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;cursor:pointer}
.ev.solid{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent-ink);font-weight:500}
.ev.guess{background:var(--warn-soft);border-left-color:var(--warn);border-left-style:dashed;
  color:var(--warn-ink);font-weight:500}
.ev.meeting{background:var(--meet-soft);border-left-color:var(--meet);color:var(--meet-ink);font-weight:500}
.more{font-size:10.5px;color:var(--faint);margin-top:3px;padding-left:5px;letter-spacing:.03em}

/* 週檢視：一列七格、格子加高，當週事項全部列出不截斷 */
.dlab{display:none;font-size:11.5px;color:var(--faint);margin-left:6px;
  font-variant-numeric:tabular-nums}
.grid.wk .dlab{display:inline}
.grid.wk .cell{min-height:330px;padding:7px 8px 9px}
/* 週檢視是為了看細節，故不截斷文字 */
.grid.wk .ev{font-size:12.5px;line-height:1.5;margin-top:4px;padding:3px 7px;
  display:block;-webkit-line-clamp:none;line-clamp:none}
.detail{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:15px 17px;margin-bottom:28px;box-shadow:var(--shadow)}
.detail h3{margin:0 0 11px;font-size:13.5px;font-weight:500;letter-spacing:.05em;color:var(--muted)}
.detail .none{color:var(--faint);font-size:13px}
.row{padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
.row .t{font-size:10.5px;font-weight:500;padding:2px 9px;border-radius:var(--r-sm);margin-right:8px;
  letter-spacing:.08em;border-left:3px solid transparent;white-space:nowrap}
.t.solid{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent-ink)}
.t.guess{background:var(--warn-soft);border-left-color:var(--warn);border-left-style:dashed;color:var(--warn-ink)}
.t.meeting{background:var(--meet-soft);border-left-color:var(--meet);color:var(--meet-ink)}
.row .n{font-weight:500;font-size:14.5px;cursor:pointer}
.row .n:hover,.ev:hover{text-decoration:underline;text-underline-offset:2px}
.row .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.row .raw{color:var(--faint);font-size:11.5px;margin-top:4px;font-style:italic;
  padding-left:9px;border-left:2px solid var(--border)}
.sechead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
h2.sec{font-size:10.5px;font-weight:500;letter-spacing:.24em;color:var(--faint);
  text-transform:uppercase;margin:0}
.yrs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.yr{font-size:12.5px;padding:3px 12px;border-radius:var(--r-sm);cursor:pointer;user-select:none;
  border:1px solid var(--border);background:transparent;color:var(--muted);letter-spacing:.04em;
  transition:background .12s,border-color .12s,color .12s}
.yr:hover{background:var(--surface-2);border-color:var(--accent-line);color:var(--accent-ink)}
.yr.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.yr.on:hover{background:var(--accent-hi);border-color:var(--accent-hi);color:var(--accent-fg)}
.sechint{font-size:12px;color:var(--faint);margin-bottom:14px}
.mo{font-size:12.5px;font-weight:500;margin:28px 0 11px;padding-bottom:8px;letter-spacing:.1em;
  color:var(--muted);border-bottom:1px solid var(--border);
  display:flex;align-items:baseline;gap:9px}
.mo .c{font-size:10.5px;font-weight:400;color:var(--faint);background:transparent;
  border:1px solid var(--border);border-radius:var(--r-sm);padding:0 7px;letter-spacing:.04em}
/* 摘要篩選列：月份 chip + 排序 + 全部展開 */
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.mons{display:flex;gap:6px;flex-wrap:wrap}
.filters .btn{font-size:12.5px;padding:3px 12px}
.filters .sp{margin-left:auto;display:flex;gap:8px}

/* 摘要卡片：預設收合，一行一場；20 場全展開會長到 15 個螢幕 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden}
.card>summary{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  padding:10px 16px;cursor:pointer;list-style:none;user-select:none;transition:background .12s}
.card>summary::-webkit-details-marker{display:none}
.card>summary::before{content:'▸';flex:none;align-self:center;font-size:10px;
  color:var(--faint);transition:transform .15s}
.card[open]>summary::before{transform:rotate(90deg)}
.card>summary:hover{background:var(--surface-2)}
.card[open]>summary{border-bottom:1px solid var(--line)}
.cnt{margin-left:auto;font-size:11.5px;color:var(--faint);letter-spacing:.03em;white-space:nowrap}
.cbody{padding:11px 16px 14px}
.date{font-variant-numeric:tabular-nums;font-weight:500;font-size:12.5px;color:var(--accent-ink);
  letter-spacing:.04em;white-space:nowrap}
.mname{font-size:15.5px;font-weight:500;letter-spacing:.02em}
.wdl{color:var(--faint);font-size:12px}
ul{margin:5px 0 0;padding-left:18px}
li{margin:2px 0;font-size:14px}
.todo{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);font-size:13px}
.todo b{color:var(--accent-ink);font-weight:500}
.todo.g b{color:var(--warn-ink)}
.todo.u b{color:var(--faint)}
.none{text-align:center;color:var(--faint);padding:30px;border:1px dashed var(--border);
  border-radius:var(--r-lg)}
.older{font-size:12px;color:var(--faint);text-align:center;padding:12px;margin-top:9px;
  border-top:1px dashed var(--border)}
footer{margin-top:38px;padding-top:15px;border-top:1px solid var(--border);
  color:var(--faint);font-size:12px}
.pop{position:fixed;z-index:50;width:370px;max-width:calc(100vw - 20px);display:none;
  max-height:calc(100dvh - 20px);overflow-y:auto;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:15px 17px;
  box-shadow:var(--shadow-pop)}
.pop.on{display:block}
.pop .x{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--faint);font-size:16px;
  line-height:1;border:none;background:none;padding:4px 8px;border-radius:var(--r-sm);font-family:inherit}
.pop .hd{font-size:15.5px;font-weight:500;margin:0 24px 5px 0;line-height:1.5;letter-spacing:.02em}
.pop .dt{font-size:12.5px;font-weight:500;color:var(--accent-ink);margin-bottom:9px;letter-spacing:.04em}
.pop .dt.g{color:var(--warn-ink)}
.pop .raw{font-size:12px;color:var(--faint);font-style:italic;
  padding-left:9px;border-left:2px solid var(--border);margin-top:7px}
.pop .src{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.pop .srcl{font-size:10px;font-weight:500;letter-spacing:.22em;color:var(--faint);
  text-transform:uppercase}
.pop .srcm{font-size:14.5px;font-weight:500;margin:4px 0 6px;letter-spacing:.02em}
.pop ul{margin:0;padding-left:17px;max-height:170px;overflow-y:auto}
.pop li{font-size:12.5px;color:var(--muted);margin:2px 0;line-height:1.55}
.pop .acts{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.pop .a{font-size:12.5px;border:1px solid var(--border);background:transparent;color:var(--muted);
  border-radius:var(--r-sm);padding:5px 11px;cursor:pointer;font-family:inherit;line-height:1.5;
  transition:background .12s,border-color .12s,color .12s}
.pop .a:hover{background:var(--surface-2);border-color:var(--accent-line);color:var(--accent-ink)}
.pop .x:hover{background:var(--surface-2);color:var(--text)}
.pop details{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.pop summary{font-size:12.5px;color:var(--muted);cursor:pointer;list-style:none;user-select:none}
.pop summary::-webkit-details-marker{display:none}
.pop summary::before{content:'▸';display:inline-block;font-size:10px;margin-right:5px}
.pop details[open] summary::before{content:'▾'}
.pop pre{margin:9px 0 0;padding:11px 12px;background:var(--surface-2);border-radius:var(--r-sm);
  border:1px solid var(--line);font-family:inherit;font-size:11.5px;line-height:1.65;
  color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:220px;overflow-y:auto}
@keyframes flash{0%,100%{box-shadow:var(--shadow)}25%,60%{box-shadow:0 0 0 2px var(--accent)}}
.card.hl{animation:flash 1.8s ease}

.notrans,.notrans *{transition:none!important}
/* 配色切換鈕 */
.tgl{margin-left:auto;align-self:center;flex:none;width:32px;height:32px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;
  cursor:pointer;font-family:inherit;border-radius:var(--r-sm);
  border:1px solid var(--border);background:transparent;color:var(--muted);
  transition:background .12s,border-color .12s,color .12s}
.tgl:hover{background:var(--surface-2);border-color:var(--accent-line);color:var(--accent-ink)}
.tgl:active{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:focus-visible,.yr:focus-visible,.tgl:focus-visible,.lock:focus-visible,
.pop .a:focus-visible,.pop .x:focus-visible,
.gatebox button:focus-visible{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.gatebox button:hover:not(:disabled){background:var(--accent-hi);border-color:var(--accent-hi)}
.gate .tgl{position:fixed;top:14px;right:14px;margin-left:0}

@media(max-width:700px){
  .wrap{padding:20px 12px 70px}
  .cell{min-height:62px;padding:3px 1px}
  /* 欄寬僅約 47px，兩行放不下幾個字，故放寬到三行並縮減內距換取字數 */
  .ev{font-size:9.5px;padding:1px 2px;-webkit-line-clamp:3;line-clamp:3}

}

<script src="data/vault.js?v=281951bcc046"></script>
<script>
/* ============================================================
   資料以 AES-256-GCM 加密，金鑰由 PBKDF2-SHA256 從密碼派生。
   位元組排列：salt(16) ‖ iv(12) ‖ ciphertext ‖ authTag(16)
   解密後為 gzip 壓縮的 JSON。
   密碼只存在於記憶體與 sessionStorage，永不寫入任何檔案或網路請求。
   ============================================================ */
const V = window.VAULT;
const gate = document.getElementById('gate');
const msg = document.getElementById('msg');
const pwIn = document.getElementById('pw');
const goBtn = document.getElementById('go');
const KEEPKEY = 'wj.pw';

async function decrypt(pass) {
  const raw = Uint8Array.from(atob(V.d), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), body = raw.slice(28);
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: V.iter, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, body);
  if (!V.gz) return JSON.parse(new TextDecoder().decode(plain));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

async function unlock(pass, remember) {
  if (!pass) { msg.className = 'msg err'; msg.textContent = '請輸入密碼'; return; }
  goBtn.disabled = true; pwIn.disabled = true;
  msg.className = 'msg work';
  msg.innerHTML = '<span class="spin"></span>解密中，請稍候…';
  await new Promise(r => setTimeout(r, 30));   // 讓畫面先更新
  try {
    const payload = await decrypt(pass);
    if (remember) { try { sessionStorage.setItem(KEEPKEY, pass); } catch (e) {} }
    gate.style.display = 'none';
    document.getElementById('app').style.display = '';
    boot(payload);
  } catch (e) {
    try { sessionStorage.removeItem(KEEPKEY); } catch (e2) {}
    msg.className = 'msg err';
    msg.textContent = (typeof DecompressionStream === 'undefined')
      ? '這個瀏覽器版本太舊，不支援解壓縮，請更新瀏覽器'
      : '密碼不正確';
    goBtn.disabled = false; pwIn.disabled = false;
    pwIn.value = ''; pwIn.focus();
  }
}

goBtn.addEventListener('click', () => unlock(pwIn.value, document.getElementById('keep').checked));
pwIn.addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock(pwIn.value, document.getElementById('keep').checked);
});
document.getElementById('relock').addEventListener('click', () => {
  try { sessionStorage.removeItem(KEEPKEY); } catch (e) {}
  location.reload();
});
(function () {
  let saved = null;
  try { saved = sessionStorage.getItem(KEEPKEY); } catch (e) {}
  if (saved) unlock(saved, true); else pwIn.focus();
})();

/* ── 以下為解密成功後的主畫面邏輯 ── */
let IDX, EV = [], IX = {}, curY, curM, SEL = null, KW = '', YEAR = 'all', ANCHOR = null;
let MONTH = 'all', SORT = 'desc', ALLOPEN = false;   // 摘要區的月份篩選、排序、展開狀態
let VIEW = 'month', WSTART = null;   // WSTART：週檢視當週的週日（Date）
const POP = document.getElementById('pop');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const WD = '日一二三四五六';
const pad = n => String(n).padStart(2, '0');
const key = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const d0 = iso => new Date(iso + 'T00:00:00');
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const TKEY = key(TODAY), CURY = TODAY.getFullYear();
const fmt = (iso, t) => {
  const d = d0(iso); if (isNaN(d)) return esc(iso);
  const y = d.getFullYear() !== CURY ? d.getFullYear() + '/' : '';
  return y + (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）' + (t ? ' ' + t : '');
};

function boot(payload) {
  IDX = payload.index;
  Object.keys(payload.journal).forEach(y => { EV = EV.concat(payload.journal[y]); });
  curY = TODAY.getFullYear(); curM = TODAY.getMonth();
  const ys = IDX.years.map(y => y.year);
  YEAR = ys.includes(CURY) ? CURY : (ys.length ? ys[ys.length - 1] : 'all');
  buildYearChips(); bind(); renderAll();
}

function buildYearChips() {
  const ys = IDX.years.map(y => y.year).sort((a, b) => b - a);
  const total = IDX.years.reduce((s, y) => s + y.count, 0);
  document.getElementById('yrs').innerHTML =
    ys.map(y => '<span class="yr' + (YEAR === y ? ' on' : '') + '" data-y="' + y + '">' + y + '</span>').join('')
    + '<span class="yr' + (YEAR === 'all' ? ' on' : '') + '" data-y="all">全部 ' + total + ' 場</span>';
}

function buildIndex() {
  const ix = {}, push = (k, o) => { (ix[k] = ix[k] || []).push(o); };
  EV.forEach(m => {
    if (!KW || JSON.stringify(m).toLowerCase().includes(KW)) push(m.date, { type: 'meeting', name: m.meeting, m });
    (m.action_items || []).forEach(a => {
      if (!a.when) return;
      if (KW && !(JSON.stringify(a) + JSON.stringify(m)).toLowerCase().includes(KW)) return;
      push(a.when, { type: a.confidence, name: a.what, a, m });
    });
  });
  const order = { solid: 0, guess: 1, meeting: 2 };
  Object.keys(ix).forEach(k => ix[k].sort((a, b) => order[a.type] - order[b.type]));
  return ix;
}

const weekStart = d => { const s = new Date(d); s.setHours(0, 0, 0, 0); s.setDate(s.getDate() - s.getDay()); return s; };

/* limit 為 null 時列出當天全部事項（週檢視）；月檢視則截到三項 */
function cellHTML(d, limit, label) {
  const k = key(d), evs = IX[k] || [], cls = ['cell'];
  if (limit !== null && d.getMonth() !== curM) cls.push('out');
  if (k === TKEY) cls.push('today');
  if (k === SEL) cls.push('sel');
  const list = limit === null ? evs : evs.slice(0, limit);
  return '<div class="' + cls.join(' ') + '" data-k="' + k + '">'
    + '<span class="dnum">' + d.getDate() + '</span>'
    + (label ? '<span class="dlab">' + (d.getMonth() + 1) + '/' + d.getDate() + '　週' + WD[d.getDay()] + '</span>' : '')
    + list.map((e, j) => '<div class="ev ' + e.type + '" data-ref="' + k + '#' + j + '">'
      + (e.a && e.a.time ? esc(e.a.time) + ' ' : '') + esc(e.name) + '</div>').join('')
    + (limit !== null && evs.length > limit ? '<div class="more">+' + (evs.length - limit) + ' 項</div>' : '')
    + '</div>';
}

function renderCal() {
  const grid = document.getElementById('grid'), cal = document.getElementById('cal');
  let h = '';
  if (VIEW === 'week') {
    if (!WSTART) WSTART = weekStart(SEL ? d0(SEL) : TODAY);
    for (let i = 0; i < 7; i++) {
      const d = new Date(WSTART); d.setDate(WSTART.getDate() + i);
      h += cellHTML(d, null, true);
    }
    grid.className = 'grid wk'; cal.className = 'cal wkmode';
    const end = new Date(WSTART); end.setDate(WSTART.getDate() + 6);
    document.getElementById('mtitle').textContent =
      WSTART.getFullYear() + ' 年 ' + (WSTART.getMonth() + 1) + ' 月 ' + WSTART.getDate() + ' 日 – '
      + (end.getFullYear() !== WSTART.getFullYear() ? end.getFullYear() + ' 年 ' : '')
      + (end.getMonth() + 1) + ' 月 ' + end.getDate() + ' 日';
  } else {
    const first = new Date(curY, curM, 1);
    const st = new Date(first); st.setDate(1 - first.getDay());
    const weeks = Math.ceil((first.getDay() + new Date(curY, curM + 1, 0).getDate()) / 7);
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(st); d.setDate(st.getDate() + i);
      h += cellHTML(d, 3, false);
    }
    grid.className = 'grid'; cal.className = 'cal';
    document.getElementById('mtitle').textContent = curY + ' 年 ' + (curM + 1) + ' 月';
  }
  grid.innerHTML = h;
  document.querySelectorAll('#viewseg .segb').forEach(b =>
    b.classList.toggle('on', b.dataset.v === VIEW));
}

function renderDetail() {
  const el = document.getElementById('detail');
  if (!SEL) {
    const n = Object.keys(IX).filter(k => k >= TKEY).length;
    el.innerHTML = '<h3>點選日期查看當天內容</h3><div class="none">'
      + (n ? '今天之後還有 ' + n + ' 天排有事項' : '今天之後尚無排定事項') + '</div>';
    return;
  }
  const d = d0(SEL), evs = IX[SEL] || [], label = { solid: '已確認', guess: '待確認', meeting: '會議' };
  let h = '<h3>' + SEL + '　週' + WD[d.getDay()] + (SEL === TKEY ? '　·　今天' : '') + '</h3>';
  if (!evs.length) h += '<div class="none">這天沒有紀錄</div>';
  evs.forEach((e, i) => {
    const ref = ' data-ref="' + SEL + '#' + i + '"';
    h += '<div class="row"><span class="t ' + e.type + '">' + label[e.type] + '</span>';
    if (e.type === 'meeting') {
      h += '<span class="n"' + ref + '>' + esc(e.name) + '</span><div class="sub">'
        + e.m.summary.length + ' 項重點　·　' + (e.m.action_items || []).length + ' 項待辦</div>';
    } else {
      const sub = [e.a.time, e.a.at_meeting, e.a.where, e.a.who && ('由 ' + e.a.who + ' 報告'),
        '出自 ' + e.m.date + ' ' + e.m.meeting].filter(Boolean).map(esc).join('　·　');
      h += '<span class="n"' + ref + '>' + esc(e.name) + '</span><div class="sub">' + sub + '</div>'
        + (e.a.raw ? '<div class="raw">筆記原文：' + esc(e.a.raw) + '</div>' : '');
    }
    h += '</div>';
  });
  el.innerHTML = h;
}

const CAP = 200;
function renderSum() {
  /* 年份與搜尋先篩，月份 chip 的場次數依這個範圍算，才不會出現點了是空的月份 */
  const scope = EV.filter(m => !KW || JSON.stringify(m).toLowerCase().includes(KW))
    .filter(m => YEAR === 'all' || m.date.slice(0, 4) === String(YEAR));
  buildMonthChips(scope);

  const all = scope.filter(m => MONTH === 'all' || m.date.slice(0, 7) === MONTH)
    .slice().sort((a, b) => SORT === 'desc'
      ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
  const shown = all.slice(0, CAP), over = all.length - shown.length, groups = {};
  shown.forEach(m => { (groups[m.date.slice(0, 7)] = groups[m.date.slice(0, 7)] || []).push(m); });
  let h = '';
  if (!all.length) h = '<div class="none">' + (KW ? '沒有符合的紀錄' : '這個範圍沒有會議紀錄') + '</div>';
  const ks = Object.keys(groups).sort();
  if (SORT === 'desc') ks.reverse();
  ks.forEach(k => {
    const [y, mo] = k.split('-');
    h += '<div class="mo">' + y + ' 年 ' + (+mo) + ' 月<span class="c">' + groups[k].length + ' 場</span></div>';
    groups[k].forEach(m => {
      /* 預設收合；搜尋命中或按了「全部展開」時才展開 */
      const open = (ALLOPEN || KW) ? ' open' : '', nt = (m.action_items || []).length;
      h += '<details class="card" id="mtg-' + EV.indexOf(m) + '"' + open + '><summary>'
        + '<span class="date">' + esc(m.date) + '</span>'
        + '<span class="mname">' + esc(m.meeting) + '</span>'
        + '<span class="wdl">週' + WD[d0(m.date).getDay()]
        + (m.host_unit ? '　主辦：' + esc(m.host_unit) : '') + '</span>'
        + '<span class="cnt">' + m.summary.length + ' 項重點'
        + (nt ? '　·　' + nt + ' 項待辦' : '') + '</span>'
        + '</summary><div class="cbody">'
        + '<ul>' + m.summary.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>'
        + (m.action_items || []).map(a => {
          const c = a.confidence, lb = c === 'solid' ? '下次' : c === 'guess' ? '待確認' : '未定';
          const body = [a.when && fmt(a.when, a.time), a.at_meeting, a.where, a.who, a.what]
            .filter(Boolean).map(esc).join('　·　');
          return '<div class="todo ' + (c === 'guess' ? 'g' : c === 'undated' ? 'u' : '') + '"><b>'
            + lb + '：</b>' + body + '</div>';
        }).join('') + '</div></details>';
    });
  });
  if (over > 0) h += '<div class="older">還有 ' + over + ' 場未顯示（單次最多 ' + CAP
    + ' 場）—— 用年份、月份或搜尋縮小範圍</div>';
  document.getElementById('sum').innerHTML = h;
  document.getElementById('expall').textContent = ALLOPEN ? '全部收合' : '全部展開';
  document.getElementById('sortbtn').textContent = SORT === 'desc' ? '新→舊' : '舊→新';
  const scopeLabel = (YEAR === 'all' ? '全部年份' : YEAR + ' 年')
    + (MONTH === 'all' ? '' : '　·　' + (+MONTH.slice(5)) + ' 月');
  document.getElementById('sechint').textContent =
    scopeLabel + '　·　顯示 ' + shown.length + ' 場'
    + (KW ? '（符合搜尋 ' + scope.length + ' 場，已自動展開）' : '　·　點標題列展開內容');
}

/* 月份 chip：只列出目前範圍內真的有紀錄的月份 */
function buildMonthChips(scope) {
  const cnt = {};
  scope.forEach(m => { const k = m.date.slice(0, 7); cnt[k] = (cnt[k] || 0) + 1; });
  const ks = Object.keys(cnt).sort().reverse();
  if (MONTH !== 'all' && !cnt[MONTH]) MONTH = 'all';   // 篩選後該月份消失就退回全部
  document.getElementById('mons').innerHTML =
    '<span class="yr' + (MONTH === 'all' ? ' on' : '') + '" data-m="all">全部月份</span>'
    + ks.map(k => '<span class="yr' + (MONTH === k ? ' on' : '') + '" data-m="' + k + '">'
      + (YEAR === 'all' ? k.slice(0, 4) + '/' : '') + (+k.slice(5)) + ' 月</span>').join('');
}

function renderAll() {
  IX = buildIndex(); renderCal(); renderDetail(); renderSum();
  const items = []; EV.forEach(m => (m.action_items || []).forEach(a => items.push(a)));
  document.getElementById('stat').textContent =
    EV.length + ' 場　·　' + items.filter(a => a.confidence === 'solid').length + ' 已確認　·　'
    + items.filter(a => a.confidence === 'guess').length + ' 待確認';
  document.getElementById('foot').textContent =
    '資料更新於 ' + (IDX.updated_at || '—') + '　·　紀錄永久保留　·　此頁資料經加密存放';
}

function closePop() { POP.classList.remove('on'); ANCHOR = null; }
function placePop() {
  if (!ANCHOR) return;
  const r = ANCHOR.getBoundingClientRect(), pr = POP.getBoundingClientRect();
  const pw = pr.width, ph = pr.height, gap = 8, p = 10;
  let left = r.left, top = r.bottom + gap;
  if (left + pw > innerWidth - p) left = r.right - pw;
  if (top + ph > innerHeight - p) top = r.top - ph - gap;
  left = Math.min(Math.max(p, left), Math.max(p, innerWidth - pw - p));
  top = Math.min(Math.max(p, top), Math.max(p, innerHeight - ph - p));
  POP.style.left = left + 'px'; POP.style.top = top + 'px';
}
function openPop(ref, anchor) {
  const [k, i] = ref.split('#'), e = (IX[k] || [])[+i];
  if (!e) return;
  const m = e.m, d = d0(k), dstr = k + '　週' + WD[d.getDay()];
  let h = '<button class="x">✕</button>';
  if (e.type === 'meeting') {
    h += '<div class="hd">' + esc(m.meeting) + '</div><div class="dt">' + dstr + '　·　會議紀錄</div>'
      + '<div class="srcl">當次重點</div><ul>'
      + m.summary.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>';
  } else {
    h += '<div class="hd">' + esc(e.name) + '</div>'
      + '<div class="dt' + (e.type === 'guess' ? ' g' : '') + '">' + dstr
      + (e.a.time ? '　' + esc(e.a.time) : '') + '　·　'
      + (e.type === 'solid' ? '已確認行程' : '待你確認時間') + '</div>';
    const sub = [e.a.at_meeting, e.a.where, e.a.who && ('由 ' + e.a.who + ' 報告')].filter(Boolean);
    if (sub.length) h += '<div style="color:var(--muted);font-size:13px">' + sub.map(esc).join('　·　') + '</div>';
    if (e.a.raw) h += '<div class="raw">筆記原文：' + esc(e.a.raw) + '</div>';
    h += '<div class="src"><div class="srcl">這件事出自</div><div class="srcm">'
      + esc(m.date) + '　' + esc(m.meeting) + '</div><ul>'
      + m.summary.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>';
  }
  const s = m.source || {};
  if (s.raw_text) h += '<details><summary>原始筆記全文'
    + (s.captured_at ? '（' + esc(s.captured_at) + ' 存入）' : '') + '</summary><pre>'
    + esc(s.raw_text) + '</pre></details>';
  h += '<div class="acts"><button class="a" data-jump="' + EV.indexOf(m) + '">跳到完整紀錄 ↓</button></div>';
  POP.innerHTML = h; POP.classList.add('on'); ANCHOR = anchor; placePop();
  const dt = POP.querySelector('details');
  if (dt) dt.addEventListener('toggle', placePop);
}
function jumpTo(idx) {
  closePop();
  const m = EV[idx]; if (!m) return;
  const y = +m.date.slice(0, 4); let need = false;
  if (KW) { KW = ''; document.getElementById('q').value = ''; need = true; }
  if (YEAR !== 'all' && YEAR !== y) { YEAR = y; buildYearChips(); need = true; }
  if (need) renderAll();
  const el = document.getElementById('mtg-' + idx); if (!el) return;
  el.open = true;   // 卡片預設收合，跳過去要自動展開
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('hl'); void el.offsetWidth; el.classList.add('hl');
}

function bind() {
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-ref]');
    if (t) { e.stopPropagation(); openPop(t.dataset.ref, t); return; }
    if (e.target.closest('.pop')) {
      if (e.target.closest('.x')) return closePop();
      const j = e.target.closest('[data-jump]');
      if (j) jumpTo(+j.dataset.jump);
      return;
    }
    closePop();
  }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
  addEventListener('resize', closePop);
  /* 前後移動：月檢視走一個月，週檢視走七天 */
  function step(n) {
    closePop();
    if (VIEW === 'week') {
      WSTART = WSTART || weekStart(SEL ? d0(SEL) : TODAY);
      WSTART.setDate(WSTART.getDate() + n * 7);
      curY = WSTART.getFullYear(); curM = WSTART.getMonth();
    } else {
      curM += n;
      if (curM < 0) { curM = 11; curY--; } else if (curM > 11) { curM = 0; curY++; }
    }
    renderCal();
  }
  document.getElementById('prev').onclick = () => step(-1);
  document.getElementById('next').onclick = () => step(1);
  document.getElementById('today').onclick = () => {
    closePop(); curY = TODAY.getFullYear(); curM = TODAY.getMonth(); WSTART = weekStart(TODAY);
    SEL = TKEY; renderCal(); renderDetail();
  };
  document.getElementById('viewseg').addEventListener('click', e => {
    const b = e.target.closest('.segb'); if (!b || b.dataset.v === VIEW) return;
    closePop();
    VIEW = b.dataset.v;
    if (VIEW === 'week') {
      /* 以選定日為準；沒選過則看今天是否落在當前月份，否則取該月一號 */
      const base = SEL ? d0(SEL)
        : (TODAY.getFullYear() === curY && TODAY.getMonth() === curM ? TODAY : new Date(curY, curM, 1));
      WSTART = weekStart(base);
      curY = WSTART.getFullYear(); curM = WSTART.getMonth();
    }
    renderCal();
  });
  document.getElementById('grid').addEventListener('click', e => {
    const c = e.target.closest('.cell'); if (!c) return;
    SEL = c.dataset.k;
    const d = d0(SEL);
    if (d.getMonth() !== curM) { curY = d.getFullYear(); curM = d.getMonth(); }
    renderCal(); renderDetail();
  });
  document.getElementById('yrs').addEventListener('click', e => {
    const y = e.target.closest('.yr'); if (!y) return;
    YEAR = y.dataset.y === 'all' ? 'all' : +y.dataset.y;
    MONTH = 'all';   // 換年份時月份篩選會失效，一併重設
    buildYearChips(); renderSum();
  });
  document.getElementById('mons').addEventListener('click', e => {
    const m = e.target.closest('.yr'); if (!m) return;
    MONTH = m.dataset.m; renderSum();
  });
  document.getElementById('sortbtn').onclick = () => { SORT = SORT === 'desc' ? 'asc' : 'desc'; renderSum(); };
  document.getElementById('expall').onclick = () => { ALLOPEN = !ALLOPEN; renderSum(); };
  document.getElementById('q').addEventListener('input', e => {
    KW = e.target.value.trim().toLowerCase(); renderAll();
  });
}
</script>
<script>
/* 深／淺配色切換：未選過時跟隨系統，選過後記在 localStorage */
(function(){
  var root=document.documentElement, btns=document.querySelectorAll('.tgl');
  if(!btns.length) return;
  var mq=window.matchMedia('(prefers-color-scheme:dark)');
  function cur(){return root.getAttribute('data-theme')||(mq.matches?'dark':'light');}
  function paint(){
    var d=cur()==='dark';
    for(var i=0;i<btns.length;i++){
      btns[i].textContent=d?'\u2600':'\u263e';
      btns[i].title=d?'切換為淺色配色':'切換為深色配色';
    }
  }
  for(var i=0;i<btns.length;i++) btns[i].addEventListener('click',function(){
    var n=cur()==='dark'?'light':'dark';
    root.classList.add('notrans');            /* 切換瞬間不要有色彩補間 */
    root.setAttribute('data-theme',n);
    try{localStorage.setItem('wj-theme',n);}catch(e){}
    paint();
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      root.classList.remove('notrans');});});
  });
  if(mq.addEventListener) mq.addEventListener('change',function(){if(!root.getAttribute('data-theme'))paint();});
  paint();
})();
</script>
